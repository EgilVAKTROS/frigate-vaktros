version: '3.8'

services:
  frigate:
    container_name: frigate
    privileged: true # This may not be necessary for all setups
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "256mb" # update for your cameras based on detection resolution
    devices:
      # - /dev/bus/usb:/dev/bus/usb # Uncomment for Google Coral USB
      # - /dev/apex_0:/dev/apex_0 # Uncomment for Google Coral PCIe
      # - /dev/video11:/dev/video11 # Uncomment for VAAPI hardware acceleration
      # - /dev/dri/renderD128:/dev/dri/renderD128 # Uncomment for Intel VAAPI
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      FRIGATE_RTSP_PASSWORD: "password123"
      # Uncomment below for GPU acceleration
      # LIBVA_DRIVER_NAME: i965 # For Intel
      # LIBVA_DRIVER_NAME: radeonsi # For AMD
    depends_on:
      - mqtt

  mqtt:
    container_name: frigate-mqtt
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  # Optional: Database for Home Assistant integration
  # mariadb:
  #   container_name: frigate-db
  #   image: mariadb:10.9
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: frigate
  #     MYSQL_DATABASE: frigate
  #     MYSQL_USER: frigate
  #     MYSQL_PASSWORD: frigate
  #   volumes:
  #     - ./db:/var/lib/mysql
  #   ports:
  #     - "3306:3306"

volumes:
  frigate-storage:
  mqtt-data:
  mqtt-log:
